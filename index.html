<style>
:root{--bg:#0d1016;--card:#161b22;--line:#2a313c;--txt:#e6edf3;--mut:#8b96a5;--y:#FFD400;--g:#7ac943;--r:#ff6b6b;--b:#61afef}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font:600 17px/1.55 Montserrat,system-ui,sans-serif;min-height:100vh}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}
header{padding:28px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:900;font-size:22px;text-decoration:none;letter-spacing:-.5px}
.logo b{color:var(--y)} .logo i{font-style:normal;color:var(--g)}
.tk{font-size:14px;font-weight:800;text-decoration:none;background:var(--y);color:#0d1016;padding:8px 14px;border-radius:40px;white-space:nowrap}
.hero{padding:28px 0 20px}
.hero h1{font-weight:900;font-size:clamp(32px,8vw,48px);line-height:1.05;letter-spacing:-1.5px}
.hero h1 span{color:var(--y)}
.hero p{color:var(--mut);margin-top:12px;max-width:520px}
.prog{margin:22px 0 6px;height:10px;background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.prog div{height:100%;background:var(--y);width:0;transition:width .4s}
.progtxt{font-size:14px;color:var(--mut)}
.grid{display:grid;gap:12px;margin-top:22px}
.aula{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-decoration:none;transition:border-color .2s,transform .2s}
.aula:hover{border-color:var(--y);transform:translateY(-2px)}
.num{font:500 15px 'JetBrains Mono',monospace;color:var(--y);background:rgba(255,212,0,.1);border-radius:10px;padding:8px 10px;flex:none}
.aula h3{font-weight:800;font-size:17px;line-height:1.25}
.aula small{display:block;color:var(--mut);font-weight:600;font-size:13px;margin-top:2px}
.st{margin-left:auto;font-size:13px;font-weight:800;white-space:nowrap;color:var(--mut)}
.st.ok{color:var(--g)}
.back{display:inline-block;margin:18px 0 6px;color:var(--mut);text-decoration:none;font-size:15px}
.back:hover{color:var(--y)}
.ah{padding:6px 0 10px}
.ah .num{display:inline-block;margin-bottom:10px}
.ah h2{font-weight:900;font-size:clamp(26px,6.5vw,36px);line-height:1.1;letter-spacing:-1px}
.ah p{color:var(--mut);margin-top:8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-top:16px}
.q .qn{font-size:13px;color:var(--y);font-weight:800;letter-spacing:.5px}
.q h4{font-weight:800;font-size:18px;line-height:1.35;margin:6px 0 12px}
pre{background:#0b0e13;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:500 15px/1.6 'JetBrains Mono',monospace;overflow-x:auto;margin:0 0 14px;font-variant-ligatures:none}
.k{color:#c678dd}.s{color:#98c379}.n{color:#d19a66}.c{color:#7f8b99}.f{color:var(--b)}
.ops{display:grid;gap:8px}
.op{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:#1c222b;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600;line-height:1.4;transition:border-color .15s,background .15s}
.op code{font:500 15px 'JetBrains Mono',monospace}
.op:hover:not([disabled]){border-color:#4b5563}
.op:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.op.right{border-color:var(--g);background:rgba(122,201,67,.12)}
.op.wrong{border-color:var(--r);background:rgba(255,107,107,.1)}
.op[disabled]{cursor:default}
.exp{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,212,0,.07);border-left:4px solid var(--y);font-size:15px;display:none}
.exp.on{display:block}
.exp b{color:var(--y)}
.des{background:linear-gradient(135deg,rgba(255,212,0,.1),rgba(122,201,67,.06));border:1px dashed var(--y);border-radius:18px;padding:20px 18px;margin-top:22px}
.des .qn{color:var(--y);font-size:13px;font-weight:900;letter-spacing:.5px}
.des h4{font-weight:800;font-size:18px;margin:6px 0 12px;line-height:1.35}

.btn.alt{background:transparent;color:var(--txt);border:2px solid var(--line)}

.ans{display:none;margin-top:14px}.ans.on{display:block}
.score{text-align:center;margin-top:26px;padding:24px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;display:none}
.score.on{display:block}
.score .big{font-weight:900;font-size:44px;color:var(--y);line-height:1}
.score p{color:var(--mut);margin:8px 0 16px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

footer{margin-top:44px;text-align:center;color:var(--mut);font-size:14px}
footer button{all:unset;cursor:pointer;text-decoration:underline;color:var(--mut)}

 {n:'03', t:'IA vai acabar com dev?', d:'A IA escreve rápido. Quem revisa é você.',

    e:'100 × 120 / 100 = 120. Então 100 − 120 = <b>−20</b>. Preço negativo: a loja pagaria o cliente.'},
   {p:'E qual é o resultado de <code>desconto(200, 10)</code>?',

    e:'200 × 10 / 100 = 20 de desconto. 200 − 20 = <b>180</b>. Para valores normais, a função funciona. O bug só aparece no caso extremo.'},

const KEY = 'devsemdrama-progresso';
let P = {};
try { P = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { P = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };

// ---------- Estatísticas (GoatCounter) ----------
// Visitas: "/" é a página inicial, "/aula-05" o exercício do vídeo 05.
// Eventos: resposta-05-p1-certa, concluiu-05-3de3, desafio-05, clique-tiktok.
const fila = [];
function track(path, title, event){
  fila.push({path, title: title || path, event: !!event});
  flushTrack();
}
window.flushTrack = function(){
  const gc = window.goatcounter;
  if(!gc || !gc.count) return;
  while(fila.length){ try { gc.count(fila.shift()); } catch (e) {} }
};
document.addEventListener('click', e => {
  if(e.target.closest('a[href*="tiktok.com"]')) track('clique-tiktok', 'Clique: seguir no TikTok', true);
});

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(code){
  const re=/(\/\/.*$|#.*$)|("[^"]*")|\b(let|const|function|if|else|for|while|return|true|false)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_]\w*)(?=\()/gm;
  let out='',last=0,m;
  while((m=re.exec(code))){out+=esc(code.slice(last,m.index));const x=esc(m[0]);
    out+=m[1]?`<span class="c">${x}</span>`:m[2]?`<span class="s">${x}</span>`:m[3]?`<span class="k">${x}</span>`:m[4]?`<span class="n">${x}</span>`:`<span class="f">${x}</span>`;last=m.index+m[0].length;}
  return out+esc(code.slice(last));
}
const done = a => Object.keys(P[a.n] || {}).length;
const hits = a => a.q.filter((q,i)=> (P[a.n]||{})[i] === q.c).length;
const app = document.getElementById('app');

function home(){
  const total = AULAS.reduce((s,a)=>s+a.q.length,0);
  const resp = AULAS.reduce((s,a)=>s+done(a),0);

    <h1>Assistiu o vídeo?<br><span>Agora testa.</span></h1>
    <p>Um exercício rápido pra cada vídeo do DevSemDrama. Sem cadastro, direto do celular.</p>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${resp}"><div style="width:${100*resp/total}%"></div></div>
    <div class="progtxt">${resp} de ${total} perguntas respondidas</div>
  </section>
  <nav class="grid">
    ${AULAS.map(a=>{const d=done(a),ok=d===a.q.length;return `
    <a class="aula" href="#${a.n}">
      <span class="num">#${a.n}</span>
      <span><h3>${a.t}</h3><small>${a.d}</small></span>
      <span class="st ${ok?'ok':''}">${ok?`✓ ${hits(a)}/${a.q.length}`:d?`${d}/${a.q.length}`:'Começar →'}</span>
    </a>`}).join('')}
  </nav>`;
  document.title = 'DevSemDrama · Exercícios';
}

function aula(a){
  const i = AULAS.indexOf(a), next = AULAS[i+1];
  app.innerHTML = `
  <a class="back" href="#">← Todos os exercícios</a>
  <section class="ah"><span class="num">#${a.n}</span><h2>${a.t}</h2><p>${a.d}</p></section>
  ${a.q.map((q,qi)=>`
  <div class="q" data-q="${qi}">
    <div class="qn">PERGUNTA ${qi+1} DE ${a.q.length}</div>
    <h4>${q.p}</h4>
    ${q.code?`<pre>${hl(q.code)}</pre>`:''}
    <div class="ops">${q.o.map((o,oi)=>`<button class="op" data-o="${oi}">${o.replace(/<code>(.*?)<\/code>/g,(m,c)=>'<code>'+esc(c.replace(/&lt;/g,'<').replace(/&gt;/g,'>'))+'</code>')}</button>`).join('')}</div>
    <div class="exp">${q.e}</div>
  </div>`).join('')}
  <div class="des">
    <div class="qn">DESAFIO EXTRA</div>
    <h4>${a.x.p}</h4>
    ${a.x.code?`<pre>${hl(a.x.code)}</pre>`:''}
    <button class="btn alt" id="ver">Tentei. Ver resposta</button>
    <div class="ans">${a.x.r}</div>
  </div>
  <div class="score" id="score">
    <div class="big"></div>
    <p></p>
    <div class="row">
      ${next?`<a class="btn" href="#${next.n}">Próximo: #${next.n} →</a>`:`<a class="btn" href="#">Ver todos</a>`}
      <a class="btn alt" href="https://www.tiktok.com/@devsemdrama" target="_blank" rel="noopener">Seguir no TikTok</a>
    </div>
  </div>`;
  document.title = `#${a.n} ${a.t} · DevSemDrama`;
  app.querySelectorAll('.q').forEach(el=>{
    const qi = +el.dataset.q, q = a.q[qi];
    const mark = ch => {
      el.querySelectorAll('.op').forEach((b,oi)=>{ b.disabled = true;
        if(oi===q.c) b.classList.add('right'); else if(oi===ch) b.classList.add('wrong'); });
      const ex = el.querySelector('.exp'); ex.classList.add('on');
      ex.innerHTML = (ch===q.c?'<b>Isso!</b> ':'<b>Quase.</b> ') + q.e;
    };
    const prev = (P[a.n]||{})[qi];
    if(prev!==undefined) mark(prev);
    el.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>{
      const ch = +b.dataset.o; P[a.n] = P[a.n]||{}; P[a.n][qi] = ch; save(); mark(ch);
      track(`resposta-${a.n}-p${qi+1}-${ch===q.c?'certa':'errada'}`, `#${a.n} pergunta ${qi+1}: ${ch===q.c?'acertou':'errou'}`, true);
      upd(true);
    }));
  });
  document.getElementById('ver').addEventListener('click',e=>{ e.target.style.display='none'; app.querySelector('.ans').classList.add('on'); track(`desafio-${a.n}`, `#${a.n} abriu a resposta do desafio`, true); });
  const upd = (agora) => {
    if(done(a)<a.q.length) return;
    const h = hits(a), s = document.getElementById('score');
    if(agora) track(`concluiu-${a.n}-${h}de${a.q.length}`, `#${a.n} concluído: ${h}/${a.q.length}`, true);
    s.classList.add('on');
    s.querySelector('.big').textContent = `${h}/${a.q.length}`;
    s.querySelector('p').textContent = h===a.q.length ? 'Gabaritou. Sem drama.' : h>=a.q.length-1 ? 'Mandou bem. Revê a explicação da que errou.' : 'Tudo bem errar. Assiste o vídeo de novo e tenta mais uma vez.';
  };
  upd();
  window.scrollTo(0,0);
}

function route(){
  const n = location.hash.replace('#','');
  const a = AULAS.find(x=>x.n===n);
  a ? aula(a) : home();
  track(a ? `/aula-${a.n}` : '/', document.title);
}
window.addEventListener('hashchange', route);
document.getElementById('reset').addEventListener('click',()=>{ P={}; save(); route(); });
route();
</script>
</body>
</html>
